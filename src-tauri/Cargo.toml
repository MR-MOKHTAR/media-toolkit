[package]
name = "media-toolkit"
version = "1.1.0"
description = "Download and edit media, offline"
authors = ["Mokhtar Mohammadi"]
license = "GPL-3.0-or-later"
repository = "https://github.com/MR-MOKHTAR/youtube-audio-downloader"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "media_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Blocking client: build scripts are synchronous, so this drops the tokio
# build-dependency entirely. rustls avoids needing OpenSSL headers on CI.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "5", default-features = false, features = ["deflate"] }
tar = "0.4"
# `static` vendors and links liblzma from source, so no distro package is
# needed on any runner. The Linux and macOS ffmpeg builds ship as .tar.xz.
liblzma = { version = "0.4", features = ["static"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.0"
# Copying a transcript out of the app. navigator.clipboard is unreliable in the
# WebKitGTK webview this ships on for Linux -- and works in `vite dev` on
# localhost, which is the worst kind of difference: a copy button that passes
# every manual test and is dead for every user.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# The in-app yt-dlp updater and the Groq client. rustls rather than native-tls
# so no OpenSSL headers are needed on any build machine; `multipart` because
# Groq's audio endpoints take nothing else. No `json` feature: the response is
# parsed from the raw bytes, which are needed verbatim anyway to put Groq's own
# error text into AppError::Api.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "multipart",
] }
