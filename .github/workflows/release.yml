name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04, not -22.04: the 22.04 image starts brownout failures
          # on 2026-09-17 and is unsupported after 2027-04-17. The cost is glibc
          # 2.39, so the .deb installs on Ubuntu 24.04+ / Debian 13+ and not on
          # older ones. Building on the oldest supported image is the only lever
          # for that, and 24.04 is now the oldest.
          - platform: ubuntu-24.04
            args: "--target x86_64-unknown-linux-gnu --bundles deb"
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Every release before v1.1.0 shipped as "0.1.0" in its filenames and its
      # release title, because the version lives in tauri.conf.json and nothing
      # ever checked it against the tag being pushed. This runs before any
      # toolchain is installed, so a forgotten bump fails in seconds.
      - name: Verify the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version" *: *"([^"]+)".*/\1/')
          pkg=$(grep -m1 '"version"' package.json | sed -E 's/.*"version" *: *"([^"]+)".*/\1/')
          crate=$(grep -m1 '^version *=' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$crate"
          for v in "$conf" "$pkg" "$crate"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match the app version. Bump all three manifests to ${tag} (bun run set-version ${tag}) and re-tag."
              exit 1
            fi
          done

      # libwebkit2gtk-4.1 is the Tauri v2 webview; patchelf is what the deb
      # bundler uses to fix up the binary's rpath.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc' }}

      # Cold Tauri builds are 8-15 min per platform; this is the actual cost
      # centre, not the binary downloads.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      # src-tauri/binaries is deliberately NOT cached. build.rs only re-fetches
      # when the pinned URL changes, so a warm cache would freeze yt-dlp at
      # whatever version was cached -- and yt-dlp breaks against YouTube every
      # few weeks. Re-downloading ~200 MB costs under a minute on a runner and
      # guarantees every release ships a current yt-dlp and ffmpeg.

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Cheap, and it runs before the 15-minute Tauri build so a locale gap
      # fails in seconds rather than at the end of a release run.
      - name: Check translations
        run: bun run check:i18n

      - name: Build and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # yt-dlp, ffmpeg and ffprobe are downloaded by src-tauri/build.rs
          # during this step, straight from their upstream GitHub releases.
          # Without this the download is best-effort: a rate-limited runner
          # would publish an installer with no downloader in it and still go
          # green. Here a failed fetch fails the release.
          DOWNLOADER_REQUIRE_TOOLS: "1"
          DOWNLOADER_FORCE_TOOL_FETCH: "1"
        with:
          # The pushed tag verbatim, not __VERSION__. __VERSION__ expands to the
          # version in tauri.conf.json, which is what titled five past releases
          # "App v0.1.0" no matter which tag produced them. The guard above has
          # already proved the two agree. Empty on workflow_dispatch, which
          # makes tauri-action build without touching releases -- the artifact
          # upload below is the point of those runs.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('MediaToolkit {0}', github.ref_name) || '' }}
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The installers are attached to the release by the step above; this is
      # for workflow_dispatch runs, where reading a draft release to check an
      # artifact is more friction than downloading it from the run.
      - name: Upload installers to the workflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
