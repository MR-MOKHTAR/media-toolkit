<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Download media from the web and convert, compress, trim, and extract audio — all offline."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#282a36" />
    <title>Media Toolkit</title>

    <script>
      (function () {
        var dark = true;
        var root = document.documentElement;
        var effects = "lite";
        try {
          dark = localStorage.getItem("downloader-theme") !== "light";
          var storedEffects = localStorage.getItem("downloader-effects");
          if (storedEffects === "off" || storedEffects === "lite") {
            effects = storedEffects;
          }
          var lang = localStorage.getItem("downloader-language");
          if (lang === "fa" || lang === "ar" || lang === "en") {
            root.lang = lang;
            root.dir = lang === "fa" || lang === "ar" ? "rtl" : "ltr";
          }
        } catch (error) {
          // Keep defaults when storage is unavailable.
        }
        root.dataset.effects = effects;
        if (dark) root.classList.add("dark");
        root.style.background = dark ? "#282a36" : "#f4f5f7";
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
